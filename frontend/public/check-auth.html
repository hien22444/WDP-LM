<!DOCTYPE html>
<html>
<head>
    <title>Check Auth Status</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .section {
            background: #2d2d2d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        h2 { color: #4ec9b0; }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 3px;
            margin: 5px;
        }
        button:hover { background: #1177bb; }
        .error { color: #f48771; }
        .success { color: #4ec9b0; }
    </style>
</head>
<body>
    <h1>🔍 Check Authentication Status</h1>
    
    <div class="section">
        <h2>📦 LocalStorage Data</h2>
        <pre id="localStorage"></pre>
    </div>

    <div class="section">
        <h2>🍪 Cookies</h2>
        <pre id="cookies"></pre>
    </div>

    <div class="section">
        <h2>🌐 API Test</h2>
        <button onclick="testAPI()">Test GET /auth/me</button>
        <button onclick="clearAuth()">Clear All Auth Data</button>
        <pre id="apiResult"></pre>
    </div>

    <script>
        // Display localStorage
        function displayLocalStorage() {
            const storage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                storage[key] = localStorage.getItem(key);
            }
            document.getElementById('localStorage').textContent = 
                JSON.stringify(storage, null, 2) || 'Empty';
        }

        // Display cookies
        function displayCookies() {
            document.getElementById('cookies').textContent = 
                document.cookie || 'No cookies';
        }

        // Test API
        async function testAPI() {
            const resultEl = document.getElementById('apiResult');
            resultEl.textContent = 'Loading...';
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/auth/me', {
                    credentials: 'include',
                    headers: {
                        'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultEl.innerHTML = '<span class="success">✅ Logged in as: ' + 
                        data.user.email + ' (' + data.user.role + ')</span>\n\n' +
                        JSON.stringify(data, null, 2);
                } else {
                    resultEl.innerHTML = '<span class="error">❌ Not logged in</span>\n\n' +
                        JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultEl.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
            }
        }

        // Clear auth data
        function clearAuth() {
            localStorage.clear();
            sessionStorage.clear();
            document.cookie.split(";").forEach(c => {
                document.cookie = c.trim().split("=")[0] + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/';
            });
            alert('✅ Cleared all auth data! Refresh page.');
            location.reload();
        }

        // Initialize
        displayLocalStorage();
        displayCookies();
    </script>
</body>
</html>
